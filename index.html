<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>PEG 통합모듈</title>
<style>
:root{--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--teal:#0f766e;
  --sans:'Geist','Inter','Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:#fafafa;color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;-webkit-font-smoothing:antialiased}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.04);padding:36px 34px 30px;width:100%;max-width:400px}
.brand{font-size:19px;font-weight:700;letter-spacing:-.01em;margin-bottom:6px}
.brand span{color:var(--teal)}
.lead{font-size:13.5px;color:var(--muted);line-height:1.6;margin-bottom:22px}
label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:7px}
input{width:100%;font:inherit;font-size:15px;padding:11px 13px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
button{width:100%;margin-top:14px;font:inherit;font-size:14.5px;font-weight:600;color:#fff;background:var(--accent);border:0;border-radius:8px;padding:12px;cursor:pointer;transition:opacity .15s}
button:hover{opacity:.9}
button:disabled{opacity:.55;cursor:default}
.msg{font-size:12.5px;margin-top:13px;min-height:18px;line-height:1.5}
.err{color:#b91c1c}
.ok{color:var(--muted)}
.foot{margin-top:20px;padding-top:16px;border-top:1px solid var(--line);font-size:11.5px;color:#9ca3af;line-height:1.6}
</style>
</head>
<body>
<div class="card">
  <div class="brand">PEG <span>통합모듈</span></div>
  <p class="lead">인사제도 개선 프로젝트 화면입니다.<br>전달받은 비밀번호를 넣어 주세요.</p>
  <form id="f">
    <label for="pw">비밀번호</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus>
    <button id="go" type="submit">열기</button>
  </form>
  <p class="msg" id="msg"></p>
  <p class="foot">인싸이트그룹 · 내부 검토용 · 외부 공유 금지</p>
</div>
<script>
var ITER = 210000, msg = document.getElementById('msg'), go = document.getElementById('go');
var cache = null;                                   /* 내려받은 암호문을 다시 쓰지 않도록 */

function say(t, err){ msg.textContent = t; msg.className = 'msg' + (err ? ' err' : ' ok'); }

async function 받기(){
  if (cache) return cache;
  say('자료 내려받는 중…');
  var r = await fetch('d.bin', { cache: 'force-cache' });
  if (!r.ok) throw new Error('자료를 불러오지 못했습니다 (' + r.status + ')');
  cache = new Uint8Array(await r.arrayBuffer());
  return cache;
}

async function 열기(pw){
  var blob = await 받기();
  say('여는 중…');
  var salt = blob.slice(0, 16), iv = blob.slice(16, 28), ct = blob.slice(28);
  var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  var key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: salt, iterations: ITER, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  var gz = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ct);   /* 비번 틀리면 여기서 실패 */
  var html;
  if (typeof DecompressionStream === 'function') {
    var st = new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip')));
    html = await st.text();
  } else {
    throw new Error('브라우저가 오래되었습니다. 크롬 · 엣지 · 사파리 최신판으로 열어 주세요');
  }
  try { sessionStorage.setItem('peg_pw', pw); } catch (e) {}
  document.open(); document.write(html); document.close();          /* 주소의 #optic · #comp 는 그대로 남는다 */
}

document.getElementById('f').addEventListener('submit', function(e){
  e.preventDefault();
  var pw = document.getElementById('pw').value;
  if (!pw) return;
  go.disabled = true;
  열기(pw).catch(function(err){
    go.disabled = false;
    say(err && err.name === 'OperationError' ? '비밀번호가 맞지 않습니다' : (err.message || '열지 못했습니다'), true);
    document.getElementById('pw').select();
  });
});

/* 같은 세션에서 다시 들어오면 묻지 않는다 */
(function(){
  var saved = null;
  try { saved = sessionStorage.getItem('peg_pw'); } catch (e) {}
  if (saved) { go.disabled = true; 열기(saved).catch(function(){ go.disabled = false; try { sessionStorage.removeItem('peg_pw'); } catch (e) {} say(''); }); }
})();
</script>
</body>
</html>
